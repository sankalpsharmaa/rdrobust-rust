  <title id="figure-title">Rust cuts wait time across every tested RD specification</title>
  <desc id="figure-description">Two log-scale dot plots compare Rust, R, and Stata. Rust single fits take 0.62 to 1.25 milliseconds, 5.9 to 23 times faster than R and 31 to 52 times faster than Stata. Rust parallel batches are 6.1 to 7.7 times faster than one-at-a-time Rust.</desc>
