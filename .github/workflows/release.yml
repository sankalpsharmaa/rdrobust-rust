name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheel:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path rdrobust-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --sdist --manifest-path rdrobust-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  github-release:
    name: Attach Python packages to GitHub Release
    if: github.event_name == 'release'
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload wheels and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          assets=(dist/*.whl dist/*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No Python package artifacts found under dist/" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  crates-io:
    name: Publish rdrobust-core to crates.io
    if: ${{ vars.PUBLISH_CRATES_IO == 'true' }}
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Publish dry run
        run: cargo publish --dry-run -p rdrobust-core
      - name: Publish rdrobust-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="rdrobust-core"))')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -A 'rdrobust-rust-ci' \
            "https://crates.io/api/v1/crates/rdrobust-core/${version}")"
          if [ "$status" = "200" ]; then
            echo "rdrobust-core@${version} already on crates.io; skipping publish"
            exit 0
          fi
          if [ "$status" != "404" ]; then
            echo "Unexpected crates.io status ${status} for rdrobust-core@${version}" >&2
            exit 1
          fi
          cargo publish -p rdrobust-core

  pypi:
    name: Publish to PyPI
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    needs: [wheel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
