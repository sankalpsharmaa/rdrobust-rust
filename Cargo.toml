# rdrobust Rust port -- Cargo workspace.

[workspace]
resolver = "2"
members = [
    "rdrobust-core",
    "rdrobust-py",
]

# Shared metadata inherited by each crate via `<field>.workspace = true`.
[workspace.package]
edition = "2021"
version = "0.1.1"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/sankalpsharmaa/rdrobust-rust"
homepage = "https://github.com/sankalpsharmaa/rdrobust-rust"
rust-version = "1.96"
# Rust-port maintainer; the original rdrobust authors are credited in AUTHORS + NOTICE.
authors = ["Sankalp Sharma <sankalp.sharma437@gmail.com>"]
keywords = ["econometrics", "statistics", "regression", "causal-inference", "rdd"]
categories = ["science", "mathematics"]

# Release builds favor the numerical hot path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
# Do not let rustc strip the linked library. Cargo's release default
# (strip = "debuginfo") runs the bundled rust-objcopy, whose LLVM in Rust < 1.98
# leaves the __LINKEDIT string pool 4-byte aligned. dyld on macOS 27 refuses
# such a dylib when it is linked against SDK 27+ ("mis-aligned LINKEDIT string
# pool"). Fixed upstream in Rust 1.98 (rust-lang/rust#157750).
strip = "none"
